name: oc-advanced-todo

memory: 512

cpu:
  tier: 2

gpu:
  tier: 3
  screen:
    width: 60
    height: 30
    maxDepth: 8

components:
  keyboard: true
  mouse: true

internet:
  enabled: true

run:
  script: todo.lua       # boot straight into the todo list
  interactive: true
  terminateDelay: 5

filesystems:
  - label: openos
    path: builtin
    mount: /
